<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loophole Docs</title>
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="index.html">Loophole</a>
      <nav id="nav" aria-label="Documents"></nav>
    </div>
  </header>

  <main class="wrap doc-layout">
    <aside class="toc">
      <button class="toc-toggle" type="button">Contents</button>
      <div class="headings">
        <h4>On this page</h4>
        <ol id="toc-list"></ol>
      </div>
      <h4>Documents</h4>
      <ol id="doc-list"></ol>
    </aside>
    <article>
      <div class="doc-source" id="doc-source"></div>
      <div class="markdown" id="doc-body"></div>
    </article>
  </main>

  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="site.js"></script>
  <script>initDoc();</script>
</body>
</html>
