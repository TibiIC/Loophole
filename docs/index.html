<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Loophole</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="An RL environment where an LLM agent solves 3D disentanglement puzzles in a MuJoCo simulation, over MCP.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    /* 70 / 20 / 10: white reading area (70), light-blue sidebar and supporting surfaces (20),
       one vivid blue accent for links, active nav and headings (10). */
    :root {
      --base: #ffffff;        /* 70 */
      --text: #16203a;
      --muted: #55627d;
      --secondary: #eaf1ff;   /* 20 */
      --secondary-line: #d3e0fb;
      --accent: #2b5cff;      /* 10 */
      --accent-strong: #1a44d6;
    }
    html, body { background: var(--base); color: var(--text); }
    body { -webkit-font-smoothing: antialiased; }

    /* sidebar: the 20% */
    .sidebar { background: var(--secondary); border-right: 1px solid var(--secondary-line); }
    .sidebar > h1, .sidebar > h1 a { color: var(--text); font-weight: 700; letter-spacing: -0.01em; }
    .sidebar > h1 { margin: 28px auto 20px; }
    .sidebar ul li a { color: var(--muted); font-size: 15px; }
    .sidebar ul li a:hover { color: var(--accent); text-decoration: none; }
    .sidebar ul li.active > a { color: var(--accent); font-weight: 700; border-right: 3px solid var(--accent); }
    .sidebar-toggle { background: var(--secondary); }
    .sidebar-toggle span { background-color: var(--accent); }
    @media screen and (min-width: 769px) {
      .sidebar { width: 260px; }
      .content { left: 260px; }
      body.close .content { left: 0; }
      body.close .sidebar { transform: translateX(-260px); }
    }

    /* content: the 70% */
    .markdown-section { max-width: 860px; padding: 40px 32px 60px; color: var(--text); }
    .markdown-section h1 { font-size: 2.4rem; letter-spacing: -0.02em; margin-bottom: 0.6em; }
    .markdown-section h1, .markdown-section h2, .markdown-section h3, .markdown-section h4 { color: var(--text); }
    .markdown-section h2 { margin-top: 2.4em; padding-left: 12px; border-left: 4px solid var(--accent); }
    .markdown-section p, .markdown-section li { color: var(--text); }
    .markdown-section strong { color: var(--text); }
    .markdown-section a { color: var(--accent); font-weight: 600; }
    .markdown-section a:hover { color: var(--accent-strong); }
    .markdown-section code, .markdown-section pre { background: var(--secondary); }
    .markdown-section code { color: var(--accent-strong); border-radius: 4px; }
    .markdown-section pre > code { color: var(--text); }
    .markdown-section blockquote { border-left-color: var(--accent); color: var(--muted); }
    .markdown-section table { display: block; overflow-x: auto; }
    .markdown-section tr:nth-child(2n) { background: #f6f9ff; }
    .markdown-section th { background: var(--secondary); }
    .markdown-section td, .markdown-section th { border-color: var(--secondary-line); }

    /* clips and placeholders */
    .markdown-section video, .markdown-section img.clip { width: 100%; height: auto; border-radius: 8px; display: block; }
    .markdown-section .clip-caption { font-size: 0.92em; color: var(--muted); margin-top: 0.6em; }
    .markdown-section .placeholder { background: #fff7e0; border: 1px dashed #f0b429; color: #8a5a00; padding: 0.8em 1em; border-radius: 6px; }

    @media screen and (max-width: 768px) {
      .markdown-section { padding: 24px 16px 48px; }
      .markdown-section h1 { font-size: 1.9rem; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    // Fills <div id="results-table"> on the home page from results.json (the only source of
    // the results numbers). With no rows it shows a pending placeholder.
    function resultsTable(hook) {
      hook.doneEach(function () {
        var root = document.getElementById('results-table');
        if (!root) return;
        fetch('results.json', { cache: 'no-cache' })
          .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
          .then(function (data) {
            var cols = data.columns || [], rows = data.rows || [];
            root.textContent = '';
            if (data.status !== 'final' || !rows.length) {
              var p = document.createElement('p');
              p.className = 'placeholder';
              p.textContent = 'Placeholder: final results pending.';
              root.appendChild(p);
              if (!rows.length) return;
            }
            var table = document.createElement('table'), tr = document.createElement('tr');
            cols.forEach(function (c) {
              var th = document.createElement('th');
              th.textContent = c.label || c.key;
              if (c.align) th.style.textAlign = c.align;
              tr.appendChild(th);
            });
            var thead = document.createElement('thead'), tbody = document.createElement('tbody');
            thead.appendChild(tr);
            rows.forEach(function (row) {
              var r = document.createElement('tr');
              cols.forEach(function (c) {
                var td = document.createElement('td'), v = row[c.key];
                td.textContent = v === undefined || v === null || v === '' ? '—' : String(v);
                if (c.align) td.style.textAlign = c.align;
                r.appendChild(td);
              });
              tbody.appendChild(r);
            });
            table.appendChild(thead);
            table.appendChild(tbody);
            root.appendChild(table);
            if (data.caption) {
              var cap = document.createElement('p');
              cap.className = 'clip-caption';
              cap.textContent = data.caption;
              root.appendChild(cap);
            }
          })
          .catch(function (e) { root.textContent = 'Could not load results.json (' + e.message + ').'; });
      });
    }

    window.$docsify = {
      name: 'Loophole',
      loadSidebar: true,
      plugins: [resultsTable],
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
</body>
</html>
