# Harbor merges this over its base compose; "main" is the agent container.
services:
  main:
    depends_on:
      loophole-sim:
        condition: service_healthy
    environment:
      # OpenCode agent settings (docs/HARNESS_NOTES.md): OpenCode reads this inline config with the highest priority,
      # over the opencode.json Harbor writes (MCP servers, provider). Gemini 4 Carbon at OpenCode's default thinking
      # level spends the whole 32k output budget reasoning on this task and returns nothing; "low" acts.
      OPENCODE_CONFIG_CONTENT: '{"provider":{"google":{"models":{"gemini-4-carbon":{"options":{"thinkingConfig":{"thinkingLevel":"low","includeThoughts":true}}}}}}}'

  loophole-sim:
    # Built from the repository root (the agent container never sees this source).
    image: loophole-sim:local
    build:
      context: ../../..
      dockerfile: docker/sim.Dockerfile
    pull_policy: build
    environment:
      LOOPHOLE_TASK: "rattrap"
      MUJOCO_GL: "${LOOPHOLE_MUJOCO_GL:-osmesa}"
    # Explicit networking keeps the simulator OUT of Harbor's egress-control namespace (only
    # the agent container is egress-controlled): it keeps its own DNS name and network
    # namespace, so its loopback-only admin routes stay unreachable from the agent.
    command: ["python", "-m", "loophole.puzzles.rattrap.mcp_server", "--http"]
    networks: [default]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 5s
