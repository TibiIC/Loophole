# Alpha 1.0 training environment (see loophole/reward/literature_rewards.py, REFERENCES.md).
#
# Score (the only value the verifier writes to reward.txt) = episode_score(), in [0, 1]:
#   violation -> 0 (episode ends immediately)
#   solved    -> 1 - 0.5 * a / T                         in [0.5, 1]
#   unsolved  -> 0.3 * p,  p = clip(1 - best_ctg / start_ctg, 0, 1)   in [0, 0.3]
# best_ctg: roadmap cost-to-go via collision-free-visible nodes, held >= 3 consecutive actions.
# Per-step rewards are training signals only and never enter the score.
reward:
  roadmap: true                  # load roadmap-alpha-1.0-paper.npz (cost-to-go)
  auto_roadmap_components: false
  components:
    - type: cspace_tunnel        # primary: potential shaping Phi = -ctg (gamma = 1); terminal = episode_score
      weight: 1.0
      in_score: true
      params: {gamma: 1.0, alpha: 0.5, progress_cap: 0.3}
    - type: clearance_shaping    # training only, potential-based clearance kernel (adapted from IndustReal)
      weight: 0.0
      in_score: false
      params: {d_sep: 0.4, sigma_dist: 0.08, gamma: 1.0}
    - type: gauss_linking_diagnostic   # log only (open-curve Gauss integral)
      weight: 0.0
      in_score: false
