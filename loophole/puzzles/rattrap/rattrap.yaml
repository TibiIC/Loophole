# The Rat Trap: geometry and cord physics scaffold.
# PROVISIONAL VALUES throughout (proportions read off a product photo): replace each named key with a
# measurement. Units: metres, radians. Origin: centre of the base's underside; x across the frame
# (left -> right as seen from the front), y through it (front = -y, the side the "front" camera sees),
# z up. The frame stands in the plane y = 0. "Inner" = the opening inside the frame; fractions are of
# the inner width / height.

timestep: 0.001

# --- base: the foot plank the frame stands on --------------------------------------------------
base_length: 0.22          # x
base_depth: 0.12           # y
base_thickness: 0.02       # z

# --- frame: two vertical rails, top rail, bottom rail (portrait) -----------------------------------
frame_inner_width: 0.12
frame_inner_height: 0.20
rail_thickness: 0.015      # square cross-section of every rail

# --- two horizontal posts, each cantilevered from one side rail (neither reaches the other side) ----
post_thickness: 0.02       # square cross-section of both posts
post_upper_z_frac: 0.6667  # upper post: from the RIGHT rail, at 2/3 of the inner height
post_upper_length: 0.095   # leftwards from the right rail's inner face (~2/3 of the width, past the hole)
post_lower_z_frac: 0.3333  # lower post: from the LEFT rail, at 1/3 of the inner height
post_lower_length: 0.095   # rightwards from the left rail's inner face

# --- vertical cylindrical holes through the posts, around the dowels (the string passes in the annulus) --
hole_radius: 0.0065        # same for both holes
hole_sides: 6              # the round hole is a regular hexagon of thin wall boxes (apothem = hole_radius)
hole_wall: 0.0015          # radial thickness of those walls

# --- two thin dark dowels ----------------------------------------------------------------------------
dowel_radius: 0.003
dowel_left_x_frac: 0.3333  # left dowel: 1/3 of the width from the LEFT edge, hangs from the top rail
dowel_right_x_frac: 0.3333 # right dowel: 1/3 of the width from the RIGHT edge, rises from the bottom rail

# --- sphere: the end of the left dowel (rigid), below the upper post, above the lower post -----------
sphere_radius: 0.015
sphere_z_frac: 0.5         # centre at half the inner height

# --- ring: the end of the right dowel (rigid); axis left-right; the upper post passes through it -------
ring_major_radius: 0.023
ring_tube_radius: 0.004
ring_segments: 24          # N capsules around the circle (never a mesh)
# the ring's centre is on the upper post's axis, directly above the right dowel

# --- optional bodies on the cord ------------------------------------------------------------------
cord_ball_enabled: false   # a sphere welded to a cord node (ball_mode: fixed)
cord_ball_radius: 0.010
cord_ball_node: -12
ball_mode: fixed
mouse_enabled: true        # the mouse is tied to the loop: a genuine blocker for the small holes and the ring
mouse_radius: 0.011        # placeholder sphere for the mouse's body
mouse_node: auto           # cord node it is welded to; auto = the loop's far end (node n/2; open cord: the free end).
                           # Node 0 cannot hold it in this start: it sits in the wrap around the right dowel.

# --- cord: capsule chain with ball joints (joint coordinates: inextensible by construction) --------
cord_radius: 0.0012
cord_length: auto          # auto = the route's polyline length; a number must match it within 1 %
cord_segments: auto        # auto = derived from the apertures (see spec._derive_segments)
cord_mass: 0.01            # total
cord_damping: 0.00002      # per ball joint
cord_armature: 0.000001
cord_closed: true          # the string is a closed loop: the last node is joined back to the first
cord_anchor_start: false   # open cords only: pin node 0 to the world at the route's first point
# PLACEHOLDER route, [x, y, z] in metres (absolute), a closed loop (the first point is repeated at the end
# automatically): wrapped around the right dowel between the bottom rail and the lower post, both strands
# running out over the front of the base into a wide loop in front of it (loop length 2x the first placeholder).
cord_route:
  - [0.0156, -0.0044, 0.0600]
  - [0.0138, 0.0000, 0.0600]
  - [0.0156, 0.0044, 0.0600]
  - [0.0200, 0.0062, 0.0600]
  - [0.0244, 0.0044, 0.0600]
  - [0.0262, 0.0000, 0.0600]
  - [0.0244, -0.0044, 0.0600]
  - [0.0300, -0.0300, 0.0450]
  - [0.0400, -0.0500, 0.0222]
  - [0.0800, -0.1000, 0.0222]
  - [0.0800, -0.1862, 0.0222]
  - [-0.0600, -0.1862, 0.0222]
  - [-0.0600, -0.1000, 0.0222]
  - [0.0000, -0.0500, 0.0222]
  - [0.0100, -0.0300, 0.0450]

# --- rig: grab handles (the Alpha rig, unchanged: incremental moves that halt when resisted) -------
rig_num_handles: 2
rig_max_linear_step: 0.03
rig_max_angular_step: 0.5
rig_linear_speed: 0.05
rig_angular_speed: 1.0
rig_settle_steps: 200
rig_lag_limit: 0.002
rig_angle_lag_limit: 0.5
rig_stall_penetration: 0.0008
rig_grasp_tolerance: 0.01
rig_weld_solref: [0.002, 1.0]
rig_workspace_min: [-0.20, -0.20, 0.0]
rig_workspace_max: [0.20, 0.20, 0.32]

# --- physics ----------------------------------------------------------------------------------
contact_solref: [0.002, 1.0]
contact_solimp: [0.95, 0.99, 0.0005, 0.5, 2.0]
penetration_tolerance: 0.001
settle_after_route_steps: 300
medium_viscosity: 0.05     # Pa s: light viscous medium so whole-cord motion dies out (quasi-static)

# --- declared clearances: what passes through which aperture (a wrong value fails a test) ---------
# post_upper.hole / post_lower.hole: the annulus between a dowel and its hole (along z);
# ring.inside: between the upper post and the ring (along x); gap.sphere_upper / gap.sphere_lower:
# between the sphere and the upper / lower post, beside the dowel (along y); gap.upper_left /
# gap.lower_right: between a post's free end and the opposite rail (along z).
clearance_table:
  - {aperture: post_upper.hole, object: cord, expect: pass}
  - {aperture: post_upper.hole, object: mouse, expect: block}
  - {aperture: post_lower.hole, object: cord, expect: pass}
  - {aperture: post_lower.hole, object: mouse, expect: block}
  - {aperture: ring.inside, object: cord, expect: pass}
  - {aperture: ring.inside, object: mouse, expect: block}
  - {aperture: gap.sphere_upper, object: cord, expect: pass}
  - {aperture: gap.sphere_upper, object: mouse, expect: block}
  - {aperture: gap.sphere_lower, object: cord, expect: pass}
  - {aperture: gap.sphere_lower, object: mouse, expect: block}
  - {aperture: gap.upper_left, object: cord, expect: pass}
  - {aperture: gap.upper_left, object: mouse, expect: pass}
  - {aperture: gap.lower_right, object: cord, expect: pass}
  - {aperture: gap.lower_right, object: mouse, expect: pass}

# --- topological state: one generator per independent passage of the rigid structure -------------------
# The frame opening is split into separate regions by chains of the structure that the cord cannot cross:
# region B (above the upper post, right of the left dowel: top rail, right rail, upper post, left dowel) and
# region C (below the lower post, left of the right dowel: bottom rail, left rail, lower post, right dowel);
# A is the rest of the opening. U / L are the hole annuli around the dowels, R the ring's interior.
# Upper case = crossing in the positive direction, lower case = the inverse.
topology_alphabet:
  A: {disc: frame_main, positive: "front to back (+y)", aperture: null, passable: true}
  B: {disc: frame_upper_right, positive: "front to back (+y)", aperture: null, passable: true}
  C: {disc: frame_lower_left, positive: "front to back (+y)", aperture: null, passable: true}
  U: {disc: hole_upper, positive: "upwards (+z)", aperture: post_upper.hole, passable: false}
  L: {disc: hole_lower, positive: "upwards (+z)", aperture: post_lower.hole, passable: false}
  R: {disc: ring, positive: "left to right (+x)", aperture: ring.inside, passable: false}
# passable: whether a conjugate of the generator may be inserted / deleted at cost 1 in the Przytycki-Sikora
# norm (the cord, with everything it carries, can pass through that hole). A hole that a body on the cord
# (mouse, cord ball) cannot fit through is NOT passable; the bare loop fits through every hole, so all are
# passable while mouse_enabled / cord_ball_enabled are false. test_rattrap_reward checks this against the
# clearance table (aperture: the clearance-table row of the hole; null = a frame-opening region, wide open).

# --- reward (verifier-side score; shaping is training-only) -------------------------------------------
max_actions: 400            # T: action budget (placeholder until a recorded solve sets the scale)
score_alpha: 0.5            # solved -> 1 - alpha * a / T
score_progress_cap: 0.3     # unsolved -> cap * p, p = 1 - min_t ||w_t|| / ||w_0||
shaping_gamma: 1.0          # training shaping lam * (gamma * Phi_bar(s') - Phi(s)), Phi = -||w|| (Phi_bar = 0 once terminated);
                            # gamma must equal the learner's discount (e.g. 0.99) for policy invariance
shaping_lambda: 1.0
# AperturePassageAlignment potentials (training shaping only): -w exp(-(d/sigma)^2) max(0, 1 - (n . tau)^2) for the cord
# near a topology disc (n = the disc's axis, tau = the cord's local tangent there). weight 0 = computed and logged only.
shaping_alignment:
  - {disc: ring, weight: 0.0, gate_distance: 0.02}
  - {disc: hole_upper, weight: 0.0, gate_distance: 0.01}
  - {disc: hole_lower, weight: 0.0, gate_distance: 0.01}
# Swept-motion certificate of the cord between substeps (loophole/puzzles/rattrap/certify.py), alongside the
# penetration audit: off | log (count uncertified substeps) | enforce (an uncertified substep is a violation).
certify_motion: log
escape_directions: 64       # free-escape test of the frozen cord assembly (Fibonacci sphere)
